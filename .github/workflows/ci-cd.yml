name: CI/CD

on:
  push:
    branches:
      - main
      - develop

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: moveflix
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: adminadmin
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Wait for Postgres to be ready
        run: |
          for i in {1..15}; do
            if pg_isready -h localhost -p 5432; then
              echo "✅ Postgres está pronto!"
              break
            fi
            echo "⏳ Aguardando Postgres subir..."
            sleep 2
          done

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run init.sql to create schemas
        env:
          PGPASSWORD: adminadmin
        run: |
          psql -h localhost -U postgres -d moveflix -f ./init.sql

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build backend-api
        working-directory: backend-api
        run: mvn clean package

      - name: Test backend-api
        working-directory: backend-api
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/moveflix
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: adminadmin
        run: mvn test -Dspring.profiles.active=ci

      - name: Save backend-api jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-api-jar
          path: backend-api/target/*.jar

      - name: Build backend-etl
        working-directory: backend-etl
        run: mvn clean package

      - name: Test backend-etl
        working-directory: backend-etl
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/moveflix
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: adminadmin
        run: mvn test -Dspring.profiles.active=ci

      - name: Save backend-etl jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-etl-jar
          path: backend-etl/target/*.jar

  build-and-push-docker:
    needs: build-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download backend-api jar
        uses: actions/download-artifact@v4
        with:
          name: backend-api-jar
          path: backend-api/target/

      - name: Download backend-etl jar
        uses: actions/download-artifact@v4
        with:
          name: backend-etl-jar
          path: backend-etl/target/

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend-api image
        uses: docker/build-push-action@v4
        with:
          context: ./backend-api
          push: false
          tags: thiagomattos20/backend-api:latest

      - name: Test backend-api container
        run: |
          docker run -d --name backend-api-test -p 8080:8080 \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/moveflix \
            -e SPRING_DATASOURCE_USERNAME=postgres \
            -e SPRING_DATASOURCE_PASSWORD=adminadmin \
            thiagomattos20/backend-api:latest

          echo "⏳ Aguardando backend-api subir..."
          for i in {1..10}; do
            if curl --fail http://localhost:8080/moveflix/actuator/health; then
              echo "✅ API está respondendo!"
              break
            fi
            echo "⏳ Tentando novamente..."
            sleep 5
          done

          docker rm -f backend-api-test

      - name: Push backend-api image
        uses: docker/build-push-action@v4
        with:
          context: ./backend-api
          push: true
          tags: thiagomattos20/backend-api:latest

      - name: Build and push backend-etl image
        uses: docker/build-push-action@v4
        with:
          context: ./backend-etl
          push: true
          tags: thiagomattos20/backend-etl:latest
