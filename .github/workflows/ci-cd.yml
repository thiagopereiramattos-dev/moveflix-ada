name: CI/CD

on:
  push:
    branches:
      - main
      - develop

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # Build e Teste do backend-api
      - name: Build backend-api
        run: mvn clean package --file backend-api/pom.xml

      - name: Test backend-api
        run: mvn test --file backend-api/pom.xml -Dspring.profiles.active=test

      # Build e Teste do backend-etl
      - name: Build backend-etl
        run: mvn clean package --file backend-etl/pom.xml

      - name: Test backend-etl
        run: mvn test --file backend-etl/pom.xml -Dspring.profiles.active=test

  build-and-push-docker:
    needs: build-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend-api image
        uses: docker/build-push-action@v4
        with:
          context: ./backend-api
          push: true
          tags: thiagomattos20/backend-api:latest

      - name: Build and push backend-etl image
        uses: docker/build-push-action@v4
        with:
          context: ./backend-etl
          push: true
          tags: thiagomattos20/backend-etl:latest
