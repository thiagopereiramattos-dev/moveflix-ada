name: CI/CD

on:
  push:
    branches:
      - main
      - develop

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build backend-api
        working-directory: backend-api
        run: mvn clean package

      - name: Test backend-api
        working-directory: backend-api
        run: mvn test -Dspring.profiles.active=test

      - name: Save backend-api jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-api-jar
          path: backend-api/target/*.jar

      - name: Build backend-etl
        working-directory: backend-etl
        run: mvn clean package

      - name: Test backend-etl
        working-directory: backend-etl
        run: mvn test -Dspring.profiles.active=test

      - name: Save backend-etl jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-etl-jar
          path: backend-etl/target/*.jar

  build-and-push-docker:
    needs: build-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download backend-api jar
        uses: actions/download-artifact@v4
        with:
          name: backend-api-jar
          path: backend-api/target/

      - name: Download backend-etl jar
        uses: actions/download-artifact@v4
        with:
          name: backend-etl-jar
          path: backend-etl/target/

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend-api image
        uses: docker/build-push-action@v4
        with:
          context: ./backend-api
          push: false
          tags: thiagomattos20/backend-api:latest

      - name: Test backend-api container
        run: |
          docker run -d --name backend-api-test -p 8080:8080 \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/moveflix \
            -e SPRING_DATASOURCE_USERNAME=postgres \
            -e SPRING_DATASOURCE_PASSWORD=adminadmin \
            thiagomattos20/backend-api:latest
          echo "⏳ Aguardando backend-api subir..."
          for i in {1..10}; do
            if curl --fail http://localhost:8080/moveflix/actuator/health; then
              echo "✅ API está respondendo!"
              break
            fi
            echo "⏳ Tentando novamente..."
            sleep 5
          done
          docker rm -f backend-api-test

      - name: Push backend-api image
        uses: docker/build-push-action@v4
        with:
          context: ./backend-api
          push: true
          tags: thiagomattos20/backend-api:latest

      - name: Build and push backend-etl image
        uses: docker/build-push-action@v4
        with:
          context: ./backend-etl
          push: true
          tags: thiagomattos20/backend-etl:latest
