name: CI/CD

on:
  push:
    branches:
      - main
      - develop

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'

      - name: Build with Maven
        run: mvn clean package --file backend-api/pom.xml

      - name: Run tests
        run: mvn test --file backend-api/pom.xml

  build-and-push-docker:
    needs: build-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend-api image
        uses: docker/build-push-action@v4
        with:
          context: ./backend-api
          push: true
          tags: thiagomattos20/backend-api:latest

      - name: Build and push backend-etl image
        uses: docker/build-push-action@v4
        with:
          context: ./backend-etl
          push: true
          tags: thiagomattos20/backend-etl:latest
