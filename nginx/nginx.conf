server {
    listen 80;
    server_name moveflix.meudominio.com;

    location /moveflix/ {
        proxy_pass http://backend-api:8080/moveflix/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swagger/ {
        proxy_pass http://backend-api:8080/moveflix/swagger-ui/index.html;
        proxy_set_header Host $host;
    }
}
