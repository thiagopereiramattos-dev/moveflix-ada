server {
    listen 80;

    # Diretório raiz do frontend (já embutido na imagem)
    root /usr/share/nginx/html;
    index index.html;

    # Serve os arquivos estáticos do frontend (SPA)
    location / {
        try_files $uri /index.html;
    }

    # Proxy para a API backend
    location /moveflix/ {
        proxy_pass http://backend-api:8080/moveflix/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Proxy para Swagger UI (opcional)
    location /swagger/ {
        proxy_pass http://backend-api:8080/moveflix/swagger-ui/index.html;
        proxy_set_header Host $host;
    }

    # Cache para arquivos estáticos (CSS, JS, imagens)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
